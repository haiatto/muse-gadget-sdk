# museStopWatch mini apps (see CMakeLists.txt). Only the StopWatch builds them.
dependencies:
  espressif/elf_loader:
    version: ">=2.1"
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} == "m5stack_stopwatch"'
  espressif/cjson: "~1.7"
  # app.screenshot (msw_app_shot.c); esp_lv_decoder already brings it in.
  espressif/esp_new_jpeg:
    version: "1.*"
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} == "m5stack_stopwatch"'
  # msw_app_nn.c: the layers the wake word's TFLite Micro already links (2026-11-14).
  espressif/esp-nn:
    version: ">=1.3.0"
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} == "m5stack_stopwatch"'
  lvgl/lvgl:
    version: "9.5.0"
    public: true
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} == "m5stack_stopwatch"'
